name: Android CI Cloud Build

on:
  push:
    branches: [ "**" ]
    paths:
      - 'MHealth - Copy/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'MHealth - Copy/**'
      - '.github/workflows/android.yml'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Detect Changed Paths
      uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          debug:
            - 'MHealth - Copy/app/src/debug/**'
          release:
            - 'MHealth - Copy/app/src/release/**'
          common:
            - 'MHealth - Copy/app/src/main/**'
            - 'MHealth - Copy/app/build.gradle.kts'
            - 'MHealth - Copy/build.gradle.kts'
            - 'MHealth - Copy/gradle.properties'
            - 'MHealth - Copy/settings.gradle.kts'
            - '.github/workflows/android.yml'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew
      working-directory: MHealth - Copy

    - name: Build Debug APK
      if: false
      run: ./gradlew assembleDebug --no-daemon
      working-directory: MHealth - Copy

    - name: Build Release APK
      if: steps.changes.outputs.release == 'true' || steps.changes.outputs.common == 'true' || github.event_name == 'workflow_dispatch'
      run: ./gradlew assembleRelease --no-daemon
      working-directory: MHealth - Copy
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'lumen123' }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'lumen_key' }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'lumen123' }}

    - name: Build Release AAB
      if: steps.changes.outputs.release == 'true' || steps.changes.outputs.common == 'true' || github.event_name == 'workflow_dispatch'
      run: ./gradlew bundleRelease --no-daemon
      working-directory: MHealth - Copy
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'lumen123' }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'lumen_key' }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'lumen123' }}

    - name: Upload Debug APK Artifact
      if: false
      uses: actions/upload-artifact@v4
      with:
        name: lumen-debug-apk
        path: MHealth - Copy/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Upload Release APK Artifact
      if: steps.changes.outputs.release == 'true' || steps.changes.outputs.common == 'true' || github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: lumen-release-apk
        path: MHealth - Copy/app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error

    - name: Upload Release AAB Artifact
      if: steps.changes.outputs.release == 'true' || steps.changes.outputs.common == 'true' || github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: lumen-release-aab
        path: MHealth - Copy/app/build/outputs/bundle/release/app-release.aab
        if-no-files-found: error

    - name: Create GitHub Release
      if: (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'Mhealth-app') && (steps.changes.outputs.debug == 'true' || steps.changes.outputs.release == 'true' || steps.changes.outputs.common == 'true' || github.event_name == 'workflow_dispatch')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "latest"
        name: "Lumen Android App Latest Release (${{ github.ref_name }})"
        body: |
          This is the continuous, rolling build of the Lumen application.
          
          * **Lumen Dev Build**: Developer diagnostics, manual controls, and Firebase synchronization active (`app-debug.apk`).
          * **Lumen Production User Build**: Calming theme, mindfulness features, offline privacy sandbox, and doctor report generation active (`app-release.apk` / `app-release.aab`).
          
          * **Latest Commit**: `${{ github.sha }}`
          * **Last Triggered By**: `${{ github.actor }}`
        draft: false
        prerelease: true
        make_latest: true
        fail_on_unmatched_files: false
        files: |
          MHealth - Copy/app/build/outputs/apk/debug/app-debug.apk
          MHealth - Copy/app/build/outputs/apk/release/app-release.apk
          MHealth - Copy/app/build/outputs/bundle/release/app-release.aab
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
