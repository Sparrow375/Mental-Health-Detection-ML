name: Android CI Cloud Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew
      working-directory: MHealth - Copy

    - name: Build with Gradle (assembleDebug)
      run: ./gradlew assembleDebug --no-daemon
      working-directory: MHealth - Copy

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mhealth-debug-apk
        path: MHealth - Copy/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Create GitHub Release
      if: github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'Mhealth-app'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "build-${{ github.run_number }}"
        name: "MHealth Build #${{ github.run_number }} (${{ github.ref_name }})"
        body: |
          This is an automated build and release generated by GitHub Actions.
          
          * **Branch**: `${{ github.ref_name }}`
          * **Commit**: `${{ github.sha }}`
          * **Triggered by**: `${{ github.actor }}`
        draft: false
        prerelease: true
        files: MHealth - Copy/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
